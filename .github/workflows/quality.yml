name: Product Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy tripwire
      - name: Test with branch coverage
        run: uv run pytest --cov=tripwire --cov-report=term-missing --cov-report=xml
      - name: Build distributable package
        run: uv build
      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripwire-coverage
          path: coverage.xml
          if-no-files-found: ignore

  judge-console:
    name: Judge console build, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
      - name: Build and test the public evidence console
        run: npm run test
      - name: Lint the public evidence console
        run: npm run lint
