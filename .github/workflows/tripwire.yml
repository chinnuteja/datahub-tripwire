name: Tripwire Change Safety

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Deterministic demo candidate to evaluate
        required: true
        default: unsafe_semantic
        type: choice
        options:
          - unsafe_semantic
          - unsafe_related
          - unsafe_mechanical
          - safe_additive
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  assess:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TRIPWIRE_CONTEXT: examples/contexts/fraud-feature-recorded.json
      TRIPWIRE_PASSPORT: artifacts/runtime/change-passport-github.json
      TRIPWIRE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TRIPWIRE_DETAILS_URL: https://tripwire-datahub.tejachinnu572.chatgpt.site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Classify pull-request scope
        if: github.event_name == 'pull_request'
        id: scope
        shell: bash
        run: |
          mapfile -t changed_models < <(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "$TRIPWIRE_HEAD_SHA" -- "demo/fraud/models/*.sql")
          echo "count=${#changed_models[@]}" >> "$GITHUB_OUTPUT"
          printf 'model=%s\n' "${changed_models[0]:-}" >> "$GITHUB_OUTPUT"
      - name: Publish non-applicable or ambiguous Check
        if: github.event_name == 'pull_request' && steps.scope.outputs.count != '1'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const count = Number('${{ steps.scope.outputs.count }}');
            const applicable = count === 0;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.TRIPWIRE_HEAD_SHA,
              name: 'Tripwire / Change Safety',
              status: 'completed',
              conclusion: applicable ? 'success' : 'action_required',
              details_url: process.env.TRIPWIRE_DETAILS_URL,
              output: {
                title: applicable
                  ? 'Not applicable: no dbt SQL model changed'
                  : `Unverified: ${count} dbt SQL models changed`,
                summary: applicable
                  ? 'Tripwire makes no safety claim for this pull request because it does not change a supported dbt SQL model.'
                  : 'Tripwire fails closed when more than one dbt SQL model changes; assess each exact model independently.',
              },
            });
      - name: Install locked environment
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.count == '1'
        run: uv sync --frozen --extra dev
      - name: Prepare isolated demo runtime
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.count == '1'
        run: mkdir -p artifacts/runtime
      - name: Compile exact dbt manifest
        if: github.event_name == 'pull_request' && steps.scope.outputs.count == '1'
        run: uv run dbt compile --project-dir demo/fraud --profiles-dir demo/fraud
      - name: Select the one changed dbt SQL model
        if: github.event_name == 'pull_request' && steps.scope.outputs.count == '1'
        id: changed
        shell: bash
        run: |
          changed_path="$(uv run tripwire github select-dbt-path \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "$TRIPWIRE_HEAD_SHA")"
          echo "path=$changed_path" >> "$GITHUB_OUTPUT"
      - name: Execute named demonstration scenario
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: >-
          uv run tripwire assess
          --candidate "${{ inputs.candidate }}"
          --context-file "$TRIPWIRE_CONTEXT"
          --output "$TRIPWIRE_PASSPORT"
          --requested-by "github:${{ github.actor }}"
      - name: Execute the actual pull-request SQL revisions
        if: github.event_name == 'pull_request' && steps.scope.outputs.count == '1'
        continue-on-error: true
        run: >-
          uv run tripwire assess-git
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "$TRIPWIRE_HEAD_SHA"
          --changed-path "${{ steps.changed.outputs.path }}"
          --manifest-path demo/fraud/target/manifest.json
          --project-dir demo/fraud
          --context-file "$TRIPWIRE_CONTEXT"
          --output "$TRIPWIRE_PASSPORT"
          --requested-by "github:${{ github.actor }}"
      - name: Publish idempotent GitHub Check
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.count == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run tripwire github publish
          --passport "$TRIPWIRE_PASSPORT"
          --repository "${{ github.repository }}"
          --head-sha "$TRIPWIRE_HEAD_SHA"
          --details-url "$TRIPWIRE_DETAILS_URL"
      - name: Preserve Change Passport
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.count == '1'
        uses: actions/upload-artifact@v4
        with:
          name: tripwire-change-passport
          path: ${{ env.TRIPWIRE_PASSPORT }}
          if-no-files-found: error
