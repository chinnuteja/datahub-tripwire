[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datahub-tripwire"
version = "0.1.0"
description = "Adaptive change-safety agent for data, ML, and AI systems powered by DataHub"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Tripwire Contributors" }]
dependencies = [
  "acryl-datahub==1.7.0",
  "dbt-duckdb==1.10.1",
  "duckdb==1.5.5",
  "httpx>=0.28,<1",
  "mcp>=1.29,<2",
  "mcp-server-datahub==0.6.0",
  "pydantic-settings>=2.10,<3",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "sqlglot==30.15.0",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10,<8",
  "mypy>=1.17,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
tripwire = "tripwire.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["tripwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --basetemp=.pytest-tmp"
markers = [
  "integration: requires live external services such as DataHub",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["tripwire"]
branch = true
omit = [
  "tripwire/cli.py",
  "tripwire/providers/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
